name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Prepare deployment bundle
        run: |
          rm -rf deploy
          mkdir -p deploy/.next
          cp -a .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r .next/server deploy/.next/server
          cp .next/BUILD_ID deploy/.next/BUILD_ID
          cp .next/*.json deploy/.next/
          cp -r public deploy/public
          cp ecosystem.config.cjs deploy/ecosystem.config.cjs
          ls -la deploy/.next
          tar -czf release.tar.gz -C deploy .

      - name: Verify SSH reachability
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          set -eu

          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST is empty. Set it in repository Secrets."
            exit 1
          fi

          if echo "$DEPLOY_HOST" | grep -Eq '^[a-z]+://|/'; then
            echo "DEPLOY_HOST must be only a hostname or IP address, without a protocol or path."
            exit 1
          fi

          if ! echo "$DEPLOY_PORT" | grep -Eq '^[0-9]+$'; then
            echo "DEPLOY_PORT must be a numeric SSH port."
            exit 1
          fi

          RUNNER_PUBLIC_IP="$(curl -fsS https://api.ipify.org || true)"
          if [ -n "$RUNNER_PUBLIC_IP" ]; then
            echo "GitHub runner public IP: ${RUNNER_PUBLIC_IP}"
          else
            echo "Unable to determine GitHub runner public IP."
          fi

          echo "Checking SSH reachability on ${DEPLOY_HOST}:${DEPLOY_PORT}"
          if ! timeout 15 bash -c 'cat < /dev/null > /dev/tcp/$DEPLOY_HOST/$DEPLOY_PORT'; then
            echo "Unable to open a TCP connection to ${DEPLOY_HOST}:${DEPLOY_PORT}."
            echo "Check DEPLOY_HOST, DEPLOY_PORT, the server firewall, and any cloud provider firewall/security group."
            echo "If SSH is IP-restricted, allow the runner public IP above or use a self-hosted runner with a stable IP."
            exit 1
          fi

          if ! ssh-keyscan -p "$DEPLOY_PORT" -T 10 "$DEPLOY_HOST" >/dev/null; then
            echo "TCP connected, but no SSH banner was received from ${DEPLOY_HOST}:${DEPLOY_PORT}."
            echo "Check that DEPLOY_PORT points to the SSH service."
            exit 1
          fi

      - name: Upload bundle to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          set -eu

          if [ -z "$DEPLOY_USER" ]; then
            echo "DEPLOY_USER is empty. Set it in repository Secrets."
            exit 1
          fi

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY is empty. Set it in repository Secrets."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          for attempt in 1 2 3; do
            echo "Uploading release.tar.gz to ${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/release.tar.gz (attempt ${attempt}/3)"
            if scp \
              -i ~/.ssh/deploy_key \
              -P "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              release.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/release.tar.gz"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "Upload failed after 3 attempts. The runner still cannot reliably reach the server SSH port."
          exit 1

      - name: Activate release on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_ROOT: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: APP_ROOT
          script: |
            set -eu

            APP_ROOT="${APP_ROOT:-/var/www/british-graduate-school}"
            SHARED_DIR="$APP_ROOT/shared"
            RELEASES_DIR="$APP_ROOT/releases"
            CURRENT_LINK="$APP_ROOT/current"
            RELEASE_NAME="$(date +%Y%m%d%H%M%S)"
            RELEASE_DIR="$RELEASES_DIR/$RELEASE_NAME"

            mkdir -p "$SHARED_DIR" "$RELEASES_DIR" "$RELEASE_DIR"

            if [ ! -f "$SHARED_DIR/.env.production" ]; then
              echo "Missing $SHARED_DIR/.env.production"
              exit 1
            fi

            tar -xzf /tmp/release.tar.gz -C "$RELEASE_DIR"
            ln -sfn "$SHARED_DIR/.env.production" "$RELEASE_DIR/.env.production"
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            cd "$CURRENT_LINK"
            set -a
            . "$SHARED_DIR/.env.production"
            set +a

            pm2 delete british-graduate-school 2>/dev/null || true
            env -u HOSTNAME HOSTNAME=0.0.0.0 HOST=0.0.0.0 PORT=3001 NODE_ENV=production \
              pm2 start server.js --name british-graduate-school
            pm2 save

            rm -f /tmp/release.tar.gz
            ls -1dt "$RELEASES_DIR"/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
